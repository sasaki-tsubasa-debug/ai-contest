name: Update AI contest data

on:
  schedule:
    - cron: '0 22 * * *'      # 毎日 07:00 JST (UTC 22:00) に実行
  workflow_dispatch:           # 手動実行ボタンも有効

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Research (Gemini grounding)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python research.py

      - name: Commit data.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update contest data ($(date -u +%Y-%m-%d))"
          git push
